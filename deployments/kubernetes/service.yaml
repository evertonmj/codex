apiVersion: v1
kind: Service
metadata:
  name: codex-service
  labels:
    app: codex
    component: database
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet
  selector:
    app: codex
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  publishNotReadyAddresses: false

---
# Optional: LoadBalancer service for external access
# Uncomment to expose the service externally
apiVersion: v1
kind: Service
metadata:
  name: codex-service-lb
  labels:
    app: codex
    component: database
spec:
  type: LoadBalancer
  selector:
    app: codex
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  sessionAffinity: ClientIP
