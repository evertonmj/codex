nfpms:
  - id: codexdb-deb
    package_name: codexdb
    vendor: evertonmj
    homepage: "https://github.com/evertonmj/codex"
    maintainer: "evertonmj <noreply@users.noreply.github.com>"
    description: "CodexDB CLI (file-based key-value DB for Go)"
    license: MPL-2.0
    formats:
      - deb
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/codexdb/LICENSE
      - src: README.md
        dst: /usr/share/doc/codexdb/README.md
