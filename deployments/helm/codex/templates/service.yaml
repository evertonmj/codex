apiVersion: v1
kind: Service
metadata:
  name: {{ include "codex.fullname" . }}-service
  labels:
    {{- include "codex.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if eq .Values.service.type "ClusterIP" }}
  clusterIP: None
  {{- end }}
  selector:
    {{- include "codex.selectorLabels" . | nindent 4 }}
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: http
    protocol: TCP
  - name: resp
    port: {{ .Values.server.respPort }}
    targetPort: {{ .Values.server.respPort }}
    protocol: TCP
  publishNotReadyAddresses: false
