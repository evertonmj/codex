apiVersion: v1
kind: ConfigMap
metadata:
  name: codex-config
  labels:
    app: codex
    component: config
data:
  # Server configuration
  # CODEX_PORT will be auto-detected (tries 11111, 922, 1987; falls back to 8080)
  # To override, set CODEX_PORT explicitly
  CODEX_HOST: "0.0.0.0"
  CODEX_SHUTDOWN_TIMEOUT: "30s"

  # Kubernetes mode - enables /data/codex.db path (inside container)
  # For local execution, omit this to use ~/.codex_data/codex.db
  CODEX_KUBERNETES: "true"

  # Database configuration
  # In Kubernetes: uses /data/codex.db (inside container, mounted to PVC)
  # Locally: uses ~/.codex_data/codex.db (home directory)
  # You can override with CODEX_DB_PATH environment variable
  CODEX_LEDGER_MODE: "false"
  CODEX_NUM_BACKUPS: "5"

  # Compression configuration
  # Options: none, gzip, zstd, snappy
  CODEX_COMPRESSION: "gzip"
  CODEX_COMPRESSION_LEVEL: "6"

  # RESP protocol configuration
  # RESP server port (default: 212)
  # To override, set CODEX_RESP_PORT explicitly
  CODEX_RESP_PORT: "212"

  # Monitoring
  CODEX_LOG_LEVEL: "info"
