apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: codex
  labels:
    app: codex
    component: database
spec:
  serviceName: codex-service
  replicas: 1
  selector:
    matchLabels:
      app: codex
  template:
    metadata:
      labels:
        app: codex
        component: database
    spec:
      containers:
      - name: codex-service
        image: codex-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP

        # Environment variables from ConfigMap and Secret
        envFrom:
        - configMapRef:
            name: codex-config
        - secretRef:
            name: codex-secrets

        # Volume mounts
        volumeMounts:
        - name: codex-data
          mountPath: /data

        # Resource requests and limits
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

        # Liveness probe - detects if pod is alive
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        # Readiness probe - detects if pod is ready to serve traffic
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

        # Security context
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL

      # Pod security context
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      # Restart policy
      restartPolicy: Always

      # Termination grace period for graceful shutdown
      terminationGracePeriodSeconds: 30

  # Volume claim templates for persistent storage
  volumeClaimTemplates:
  - metadata:
      name: codex-data
      labels:
        app: codex
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 10Gi
