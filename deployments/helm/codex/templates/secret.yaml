apiVersion: v1
kind: Secret
metadata:
  name: {{ include "codex.fullname" . }}-secrets
  labels:
    {{- include "codex.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.security.apiKeys }}
  CODEX_API_KEYS: {{ join "," .Values.security.apiKeys | quote }}
  {{- else }}
  CODEX_API_KEYS: ""
  {{- end }}
  {{- if .Values.security.encryptionKey }}
  CODEX_ENCRYPTION_KEY: {{ .Values.security.encryptionKey | quote }}
  {{- else }}
  CODEX_ENCRYPTION_KEY: ""
  {{- end }}
